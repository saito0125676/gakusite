<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 水彩風のにじみ(DESIGN.md 6章) -->
  <defs>
    <filter id="w" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="70"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <radialGradient id="g" cx="45%" cy="45%" r="60%">
      <stop offset="0" stop-color="#3fc1c9" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#1e7fe0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1e7fe0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#w)">
    <circle cx="190" cy="200" r="130" fill="url(#g)"/>
    <circle cx="290" cy="120" r="40" fill="#3fc1c9" fill-opacity=".35"/>
    <circle cx="90" cy="310" r="26" fill="#1e7fe0" fill-opacity=".25"/>
    <circle cx="320" cy="300" r="14" fill="#3fc1c9" fill-opacity=".4"/>
  </g>
</svg>
